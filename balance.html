<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed Stock Tracker — Heritage Fish Company</title>
<style>
  :root {
    --bg: #0f1613; --panel: #16201b; --panel-2: #1c2721; --border: #2a352e;
    --text: #eaf2ec; --muted: #8fa396; --accent: #4caf7d; --accent-dark: #357a56;
    --danger: #d97757; --danger-dark: #b85c3f; --gold: #d4af6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px; max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 1.25rem; margin: 4px 0 2px; color: var(--gold); }
  .sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 16px; }
  .conn { font-size: 0.75rem; color: var(--muted); margin-bottom: 14px; }
  .conn.ok { color: var(--accent); }
  .conn.err { color: var(--danger); }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .card.low { border-color: var(--danger); }
  .brand { font-weight: 700; font-size: 1rem; }
  .brand .size { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
  .row { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
  .balance { font-size: 1.4rem; font-weight: 700; margin-top: 8px; }
  .balance .kg { font-size: 0.78rem; color: var(--muted); font-weight: 400; }
  .low-tag { display: inline-block; margin-top: 6px; background: var(--danger); color: #2a1208; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  button { padding: 9px; border-radius: 9px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; flex: 1; }
  .btn-in { background: var(--accent); color: #06210f; }
  .btn-out { background: var(--danger); color: #2a1208; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.hidden { display: none; }
  .modal { background: var(--panel-2); border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-width: 560px; }
  .modal h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .modal .sub { margin-bottom: 14px; }
  .field { margin-bottom: 10px; }
  label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 4px; }
  select, input { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 9px; font-size: 1rem; }
  .modal-btns { display: flex; gap: 10px; margin-top: 14px; }
  .modal-btns button { flex: 1; padding: 12px; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .err { color: var(--danger); font-size: 0.8rem; min-height: 16px; margin-top: 4px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>🧮 Feed Stock Tracker</h1>
<div class="sub">Heritage Fish Company — live balance, synced with the main app</div>
<div class="conn" id="conn">Connecting…</div>

<div id="grid"></div>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h2 id="mTitle">📦 Receive Stock</h2>
    <div class="sub" id="mSub">Log feed that's just arrived.</div>
    <div class="field">
      <label>Feed Type</label>
      <select id="mFeed"></select>
    </div>
    <div class="field">
      <label id="mBagsLabel">Bags Received</label>
      <input type="number" id="mBags" min="1" inputmode="numeric" placeholder="e.g. 400">
    </div>
    <div class="field">
      <label id="mDateLabel">Date</label>
      <input type="date" id="mDate">
    </div>
    <div class="field">
      <label id="mNoteLabel">Supplier / Note (optional)</label>
      <input type="text" id="mNote" placeholder="optional">
    </div>
    <div class="err" id="mErr"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-in" id="mSubmit" onclick="submitEntry()">✓ Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNhnHflq1heODof-vdffZUkNTJPQu7fWA",
  authDomain: "myproject-15210.firebaseapp.com",
  databaseURL: "https://myproject-15210-default-rtdb.firebaseio.com",
  projectId: "myproject-15210",
  storageBucket: "myproject-15210.firebasestorage.app",
  messagingSenderId: "1081766169567",
  appId: "1:1081766169567:web:6801690eb2a93a558e526a",
  measurementId: "G-2VQVL8MZ6B"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const FEEDS = [
  {id:'growel-2mm',   label:'Growel',   size:'2mm', kg:20},
  {id:'growel-3mm',   label:'Growel',   size:'3mm', kg:20},
  {id:'growel-4mm',   label:'Growel',   size:'4mm', kg:20},
  {id:'optiline-2mm', label:'Optiline', size:'2mm', kg:25},
  {id:'optiline-3mm', label:'Optiline', size:'3mm', kg:25},
  {id:'optiline-4mm', label:'Optiline', size:'4mm', kg:25},
  {id:'optiline-aminova-2mm', label:'Optiline Aminova', size:'2mm', kg:25},
  {id:'optiline-aminova-3mm', label:'Optiline Aminova', size:'3mm', kg:25},
  {id:'optiline-aminova-4mm', label:'Optiline Aminova', size:'4mm', kg:25},
];
const LOW_STOCK_BAGS = 5;

let stockEntries = [];
let logs = [];
let connCount = 0;

const connEl = document.getElementById('conn');
function markConnected(){
  connCount++;
  if (connCount >= 2){ connEl.textContent = '● Connected — live'; connEl.className = 'conn ok'; }
}

const stockEntriesRef = collection(db, 'stock_entries');
const stockQuery = query(stockEntriesRef, orderBy('date','desc'));
onSnapshot(stockQuery, snap => {
  stockEntries = snap.docs.map(d => ({ entryId: d.id, ...d.data() }));
  markConnected();
  render();
}, err => {
  connEl.textContent = '⚠ Could not connect — check internet or Firebase rules';
  connEl.className = 'conn err';
  console.error(err);
});

const logsRef = collection(db, 'feed_logs');
onSnapshot(logsRef, snap => {
  logs = snap.docs.map(d => d.data());
  markConnected();
  render();
}, err => console.error(err));

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = FEEDS.map(f => {
    const receivedBags = stockEntries.filter(s=>s.feedId===f.id && s.kind!=='used').reduce((s,e)=>s+(e.bags||0),0);
    const manualUsedBags = stockEntries.filter(s=>s.feedId===f.id && s.kind==='used').reduce((s,e)=>s+(e.bags||0),0);
    const cageUsedBags = logs.reduce((s,l)=> s + (l.feeds||[]).filter(x=>x.id===f.id).reduce((s2,x)=>s2+(x.qty||0),0), 0);
    const usedBags = cageUsedBags + manualUsedBags;
    const balance = receivedBags - usedBags;
    const low = balance <= LOW_STOCK_BAGS;
    return `
      <div class="card${low?' low':''}">
        <div class="brand">${f.label} <span class="size">${f.size}</span></div>
        <div class="row"><span>Received</span><span>${receivedBags} bags</span></div>
        <div class="row"><span>Used (cages)</span><span>${cageUsedBags} bags</span></div>
        ${manualUsedBags ? `<div class="row"><span>Used (no cage)</span><span>${manualUsedBags} bags</span></div>` : ''}
        <div class="balance">${balance.toLocaleString()} bags <span class="kg">(${(balance*f.kg).toLocaleString()} kg)</span></div>
        ${low ? '<div class="low-tag">⚠ Low Stock</div>' : ''}
        <div class="btn-row">
          <button class="btn-in" onclick="openModal('received','${f.id}')">+ Received</button>
          <button class="btn-out" onclick="openModal('used','${f.id}')">− Used</button>
        </div>
      </div>`;
  }).join('');
}

function feedOptions(selectedId){
  return FEEDS.map(f => `<option value="${f.id}" ${f.id===selectedId?'selected':''}>${f.label} ${f.size}</option>`).join('');
}

window.openModal = function(kind, feedId){
  document.getElementById('overlay').dataset.kind = kind;
  document.getElementById('mFeed').innerHTML = feedOptions(feedId);
  document.getElementById('mBags').value = '';
  document.getElementById('mNote').value = '';
  document.getElementById('mErr').textContent = '';
  document.getElementById('mDate').valueAsDate = new Date();
  if (kind === 'used'){
    document.getElementById('mTitle').textContent = '➖ Record Stock Used';
    document.getElementById('mSub').textContent = "For feed used without going through a cage (samples, spillage, etc).";
    document.getElementById('mBagsLabel').textContent = 'Bags Used';
    document.getElementById('mDateLabel').textContent = 'Date Used';
    document.getElementById('mNoteLabel').textContent = 'Reason / Note (optional)';
    document.getElementById('mSubmit').className = 'btn-out';
    document.getElementById('mSubmit').textContent = '✓ Save Stock Used';
  } else {
    document.getElementById('mTitle').textContent = '📦 Receive Stock';
    document.getElementById('mSub').textContent = "Log feed that's just arrived so the balance stays accurate.";
    document.getElementById('mBagsLabel').textContent = 'Bags Received';
    document.getElementById('mDateLabel').textContent = 'Date Received';
    document.getElementById('mNoteLabel').textContent = 'Supplier / Note (optional)';
    document.getElementById('mSubmit').className = 'btn-in';
    document.getElementById('mSubmit').textContent = '✓ Save Stock Received';
  }
  document.getElementById('overlay').classList.remove('hidden');
};
window.closeModal = function(){
  document.getElementById('overlay').classList.add('hidden');
};

window.submitEntry = async function(){
  const kind = document.getElementById('overlay').dataset.kind || 'received';
  const feedId = document.getElementById('mFeed').value;
  const bags = parseInt(document.getElementById('mBags').value) || 0;
  const date = document.getElementById('mDate').value;
  const note = document.getElementById('mNote').value.trim();
  const err = document.getElementById('mErr');
  if (bags <= 0){ err.textContent = kind==='used' ? '⚠ Enter how many bags were used.' : '⚠ Enter how many bags were received.'; return; }
  if (!date){ err.textContent = '⚠ Please pick a date.'; return; }
  try {
    await addDoc(stockEntriesRef, { feedId, bags, date, note, kind, createdAt: serverTimestamp() });
    closeModal();
    showToast(kind==='used' ? '✓ Stock usage logged' : '✓ Stock received logged');
  } catch(e){
    console.error(e);
    err.textContent = e.code === 'permission-denied'
      ? '⚠ Database rules are blocking this — ask whoever manages Firebase to allow the "stock_entries" collection.'
      : '⚠ Could not save: ' + (e.message || 'check connection.');
  }
};

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}
</script>

</body>
</html>
