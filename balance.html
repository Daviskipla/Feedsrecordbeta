<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed Stock Tracker</title>
<style>
  :root {
    --bg: #0f1613;
    --panel: #16201b;
    --panel-2: #1c2721;
    --border: #2a352e;
    --text: #eaf2ec;
    --muted: #8fa396;
    --accent: #4caf7d;
    --accent-dark: #357a56;
    --danger: #d97757;
    --danger-dark: #b85c3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    max-width: 520px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
  .conn { font-size: 0.72rem; color: var(--muted); margin-bottom: 14px; }
  .conn.ok { color: var(--accent); }
  .conn.err { color: var(--danger); }
  .balance-card {
    background: linear-gradient(135deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .balance-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .balance-num { font-size: 2.4rem; font-weight: 700; line-height: 1.15; margin-top: 2px; }
  .balance-unit { font-size: 1rem; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .low-tag { display: inline-block; margin-top: 8px; background: var(--danger); color: #2a1208; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .type-select { margin-top: 12px; }
  select, input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 1rem;
  }
  .form-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  button {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-in { background: var(--accent); color: #06210f; }
  .btn-in:active { background: var(--accent-dark); }
  .btn-out { background: var(--danger); color: #2a1208; }
  .btn-out:active { background: var(--danger-dark); }
  .manage-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    flex: none;
    padding: 8px 12px;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .log-section h2 {
    font-size: 0.95rem;
    color: var(--muted);
    margin: 18px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .entry {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .entry-left { display: flex; flex-direction: column; }
  .entry-type { font-size: 0.75rem; color: var(--muted); }
  .entry-date { font-size: 0.72rem; color: var(--muted); }
  .entry-amt { font-weight: 700; font-size: 1.05rem; }
  .amt-in { color: var(--accent); }
  .amt-out { color: var(--danger); }
  .del { background: none; border: none; color: var(--muted); font-size: 1.1rem; padding: 4px 8px; flex: none; cursor: pointer; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 0.9rem; }
  .status { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 14px; min-height: 16px; }
  .new-type-row { display: none; margin-top: 8px; gap: 8px; }
  .new-type-row.show { display: flex; }
  .new-type-row button { flex: none; padding: 10px 14px; }
</style>
</head>
<body>

<h1>🐟 Feed Stock Tracker</h1>
<div class="sub">Heritage Fish Company — feed bag inventory</div>
<div class="conn" id="conn">Connecting…</div>

<div class="balance-card">
  <div class="balance-label">Current balance</div>
  <div class="balance-num" id="balanceNum">0<span class="balance-unit">bags</span></div>
  <div id="lowTag"></div>
  <div class="type-select">
    <label for="typeFilter">Feed type</label>
    <select id="typeFilter"></select>
  </div>
</div>

<div class="form-card">
  <div class="row">
    <div>
      <label for="qty">Bags</label>
      <input type="number" id="qty" min="1" placeholder="e.g. 400" inputmode="numeric">
    </div>
    <div>
      <label for="entryType">Feed type</label>
      <select id="entryType"></select>
    </div>
  </div>
  <div class="row">
    <div>
      <label for="entryDate">Date</label>
      <input type="date" id="entryDate">
    </div>
    <div>
      <label for="note">Note (optional)</label>
      <input type="text" id="note" placeholder="e.g. Cage D1">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-in" id="btnIn">+ Received</button>
    <button class="btn-out" id="btnOut">− Used</button>
    <button class="manage-btn" id="btnManageType">Add type</button>
  </div>
  <div class="new-type-row" id="newTypeRow">
    <input type="text" id="newTypeInput" placeholder="New feed brand / type name">
    <button class="btn-in" id="saveNewType" style="flex:none;">Save</button>
  </div>
</div>

<div class="log-section">
  <h2>Recent activity</h2>
  <div id="logList"></div>
</div>

<div class="status" id="status">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD59H8-Jerse_KMlHCKehtzrJ-znX00jP0",
  authDomain: "feedbalancing.firebaseapp.com",
  databaseURL: "https://feedbalancing-default-rtdb.firebaseio.com",
  projectId: "feedbalancing",
  storageBucket: "feedbalancing.firebasestorage.app",
  messagingSenderId: "465922229901",
  appId: "1:465922229901:web:7cb8ecd6349082411104c4",
  measurementId: "G-QYSWBWYSTS"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DEFAULT_FEED_TYPES = [
  "Growel 2mm", "Growel 3mm", "Growel 4mm",
  "Optiline 2mm", "Optiline 3mm", "Optiline 4mm",
  "Optiline Aminova 2mm", "Optiline Aminova 3mm", "Optiline Aminova 4mm"
];
const LOW_STOCK_BAGS = 5;

let entries = [];
let feedTypes = [...DEFAULT_FEED_TYPES];
let connCount = 0;

const el = id => document.getElementById(id);
const balanceNum = el('balanceNum');
const typeFilter = el('typeFilter');
const entryType = el('entryType');
const logList = el('logList');
const statusEl = el('status');
const entryDate = el('entryDate');
const connEl = el('conn');
const lowTag = el('lowTag');

entryDate.valueAsDate = new Date();

function setStatus(msg, timeout) {
  statusEl.textContent = msg;
  if (timeout) setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, timeout);
}

function markConnected(){
  connCount++;
  if (connCount >= 2){ connEl.textContent = '● Connected — live'; connEl.className = 'conn ok'; }
}

function renderTypeOptions() {
  const prevFilter = typeFilter.value;
  const prevEntry = entryType.value;
  const opts = ['All feed', ...feedTypes].map(t => `<option value="${t}">${t}</option>`).join('');
  typeFilter.innerHTML = opts;
  entryType.innerHTML = feedTypes.map(t => `<option value="${t}">${t}</option>`).join('')
    || `<option value="General">General</option>`;
  if (prevFilter && [...typeFilter.options].some(o=>o.value===prevFilter)) typeFilter.value = prevFilter;
  if (prevEntry && [...entryType.options].some(o=>o.value===prevEntry)) entryType.value = prevEntry;
}

function computeBalance(type) {
  return entries
    .filter(e => type === 'All feed' || e.type === type)
    .reduce((sum, e) => sum + (e.direction === 'in' ? e.qty : -e.qty), 0);
}

function renderBalance() {
  const type = typeFilter.value || 'All feed';
  const bal = computeBalance(type);
  balanceNum.innerHTML = `${bal}<span class="balance-unit">bags</span>`;
  lowTag.innerHTML = (type !== 'All feed' && bal <= LOW_STOCK_BAGS) ? '<div class="low-tag">⚠ Low Stock</div>' : '';
}

function renderLog() {
  const type = typeFilter.value || 'All feed';
  const filtered = entries
    .filter(e => type === 'All feed' || e.type === type)
    .sort((a, b) => new Date(b.date) - new Date(a.date) || (b.ts||0) - (a.ts||0));

  if (filtered.length === 0) {
    logList.innerHTML = `<div class="empty">No entries yet. Log your first delivery or usage above.</div>`;
    return;
  }

  logList.innerHTML = filtered.map(e => `
    <div class="entry">
      <div class="entry-left">
        <div class="entry-amt ${e.direction === 'in' ? 'amt-in' : 'amt-out'}">${e.direction === 'in' ? '+' : '−'}${e.qty} bags</div>
        <div class="entry-type">${e.type}${e.note ? ' · ' + e.note : ''}</div>
        <div class="entry-date">${e.date}</div>
      </div>
      <button class="del" data-id="${e.entryId}">✕</button>
    </div>
  `).join('');

  logList.querySelectorAll('.del').forEach(btn => {
    btn.onclick = () => deleteEntry(btn.dataset.id);
  });
}

function renderAll() {
  renderBalance();
  renderLog();
}

// ---- Firestore: stock entries (received/used) ----
const entriesRef = collection(db, 'stock_entries_simple');
const entriesQuery = query(entriesRef, orderBy('date', 'desc'));
onSnapshot(entriesQuery, snap => {
  entries = snap.docs.map(d => {
    const data = d.data();
    return {
      entryId: d.id,
      direction: data.kind === 'used' ? 'out' : 'in',
      qty: data.bags || 0,
      type: data.type,
      date: data.date,
      note: data.note || '',
      ts: data.createdAt ? data.createdAt.toMillis?.() : 0
    };
  });
  markConnected();
  renderAll();
  setStatus('Synced', 1200);
}, err => {
  connEl.textContent = '⚠ Could not connect — check internet or Firebase rules';
  connEl.className = 'conn err';
  setStatus('Sync failed — check connection', 3000);
  console.error(err);
});

// ---- Firestore: custom feed types ----
const typesRef = collection(db, 'custom_feed_types_simple');
onSnapshot(typesRef, snap => {
  const custom = snap.docs.map(d => d.data().name).filter(Boolean);
  feedTypes = [...new Set([...DEFAULT_FEED_TYPES, ...custom])];
  markConnected();
  renderTypeOptions();
  renderAll();
}, err => { markConnected(); console.error(err); });

async function addEntry(direction) {
  const qty = parseInt(el('qty').value, 10);
  if (!qty || qty <= 0) {
    setStatus('Enter a valid bag count', 2000);
    return;
  }
  const type = entryType.value || 'General';
  const date = entryDate.value || new Date().toISOString().slice(0, 10);
  const note = el('note').value.trim();

  try {
    await addDoc(entriesRef, {
      type, bags: qty, date, note,
      kind: direction === 'in' ? 'received' : 'used',
      createdAt: serverTimestamp()
    });
    el('qty').value = '';
    el('note').value = '';
    setStatus('Saved', 1200);
  } catch (err) {
    console.error(err);
    setStatus(err.code === 'permission-denied'
      ? 'Blocked by Firestore rules — allow "stock_entries_simple"'
      : 'Save failed — check connection', 3500);
  }
}

async function deleteEntry(id) {
  try {
    await deleteDoc(doc(db, 'stock_entries_simple', id));
    setStatus('Removed', 1200);
  } catch (err) {
    console.error(err);
    setStatus('Could not remove — check connection', 3000);
  }
}

el('btnIn').onclick = () => addEntry('in');
el('btnOut').onclick = () => addEntry('out');
typeFilter.onchange = renderAll;

el('btnManageType').onclick = () => {
  el('newTypeRow').classList.toggle('show');
};
el('saveNewType').onclick = async () => {
  const name = el('newTypeInput').value.trim();
  if (!name) return;
  if (feedTypes.includes(name)) {
    el('newTypeInput').value = '';
    el('newTypeRow').classList.remove('show');
    entryType.value = name;
    return;
  }
  try {
    await addDoc(typesRef, { name });
    entryType.value = name;
    setStatus('Feed type added', 1200);
  } catch (err) {
    console.error(err);
    setStatus(err.code === 'permission-denied'
      ? 'Blocked by Firestore rules — allow "custom_feed_types_simple"'
      : 'Could not save type', 3000);
  }
  el('newTypeInput').value = '';
  el('newTypeRow').classList.remove('show');
};

renderTypeOptions();
renderAll();
</script>

</body>
</html>
